      <!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gestor de Base de Datos - Google Sheets</title>
    <script src="https://tailwindcss.com"></script>
</head>
<body class="bg-gray-100 min-h-screen font-sans">

    <div class="max-w-6xl mx-auto p-6">
        <!-- Encabezado -->
        <header class="bg-white rounded-xl shadow-md p-6 mb-6">
            <h1 class="text-3xl font-bold text-gray-800">📊 Gestor de Base de Datos (50k Registros)</h1>
            <p class="text-gray-600 mt-2">Acceso directo a tu Google Sheet sin configurar APIs ni consolas complejas.</p>
        </header>

        <!-- Configuración Inicial -->
        <section id="config-section" class="bg-white rounded-xl shadow-md p-6 mb-6">
            <h2 class="text-xl font-semibold text-gray-700 mb-4">🔗 Enlace de tu Google Sheet</h2>
            <div class="w-full">
                <label class="block text-sm font-medium text-gray-600">Pega la URL completa de tu hoja de cálculo:</label>
                <input type="text" id="sheet-url" placeholder="https://google.com" class="mt-1 block w-full p-3 border border-gray-300 rounded-md focus:ring-blue-500 focus:border-blue-500">
            </div>
            <button onclick="cargarDatosDirectos()" class="mt-4 bg-blue-600 hover:bg-blue-700 text-white font-medium py-2 px-6 rounded-md transition">
                Cargar Datos de Campo
            </button>
        </section>

        <!-- Panel de Control Principal (Oculto hasta conectar) -->
        <section id="main-panel" class="hidden bg-white rounded-xl shadow-md p-6 mb-6">
            <div class="flex flex-col md:flex-row justify-between items-center border-b pb-4 mb-4">
                <h2 class="text-xl font-semibold text-gray-700">🔍 Buscador y Editor en Tiempo Real</h2>
                <div class="text-sm bg-blue-100 text-blue-800 px-3 py-1 rounded-full font-medium" id="total-registros">
                    Cargando filas...
                </div>
            </div>

            <!-- Filtros de búsqueda -->
            <div class="grid grid-cols-1 md:grid-cols-3 gap-4 mb-6">
                <div>
                    <label class="block text-sm font-medium text-gray-600">Columna de búsqueda:</label>
                    <select id="buscar-columna" class="mt-1 block w-full p-2 border border-gray-300 rounded-md bg-white">
                        <!-- Se llena dinámicamente -->
                    </select>
                </div>
                <div class="md:col-span-2">
                    <label class="block text-sm font-medium text-gray-600">Escribe el término de búsqueda:</label>
                    <input type="text" id="buscar-input" oninput="filtrarDatos()" placeholder="Ej. Juan Pérez o ID_3948..." class="mt-1 block w-full p-2 border border-gray-300 rounded-md">
                </div>
            </div>

            <!-- Tabla de Resultados -->
            <div class="overflow-x-auto border border-gray-200 rounded-lg max-h-[400px] overflow-y-auto">
                <table class="min-w-full divide-y divide-gray-200">
                    <thead class="bg-gray-50 sticky top-0" id="tabla-cabecera">
                        <!-- Se llena dinámicamente -->
                    </thead>
                    <tbody class="bg-white divide-y divide-gray-200 text-sm" id="tabla-cuerpo">
                        <tr>
                            <td colspan="100" class="text-center py-8 text-gray-500">Usa el buscador superior para filtrar registros...</td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </section>
    </div>

    <script>
        let datosOriginales = [];
        let cabeceras = [];

        // Auto-conexión por URL si les pasas el enlace preparado
        window.onload = function() {
            const urlParams = new URLSearchParams(window.location.search);
            const sheetParam = urlParams.get('sheet_url');
            if (sheetParam) {
                document.getElementById('sheet-url').value = decodeURIComponent(sheetParam);
                document.getElementById('config-section').classList.add('hidden');
                cargarDatosDirectos();
            }
        }

        async function cargarDatosDirectos() {
            const urlInput = document.getElementById('sheet-url').value.trim();
            if(!urlInput) return alert("Por favor, pega la URL de tu Google Sheet.");

            try {
                // Extraer el ID de la planilla desde la URL de forma inteligente
                const matches = urlInput.match(/\/d\/([a-zA-Z0-9-_]+)/);
                if(!matches) throw new Error("La URL introducida no parece un enlace válido de Google Sheets.");
                const sheetId = matches[1];

                // Convertimos la petición a formato CSV (Es público, rápido y nativo de Google)
                const urlCsv = `https://google.com{sheetId}/export?format=csv`;
                
                const response = await fetch(urlCsv);
                if(!response.ok) throw new Error("No se pudo acceder al archivo. Asegúrate de que esté compartido como 'Cualquier persona con el enlace puede ver'.");
                
                const textoCsv = await response.text();
                
                // Procesar las filas del CSV de forma simple
                const filas = textoCsv.split("\n").map(f => f.split(","));
                
                cabeceras = filas[0].map(c => c.replace(/"/g, "").trim());
                datosOriginales = filas.slice(1).map(f => f.map(celda => celda.replace(/"/g, "").trim()));

                // Rellenar selector de columnas
                document.getElementById('buscar-columna').innerHTML = cabeceras.map((c, i) => `<option value="${i}">${c}</option>`).join('');

                // Renderizar cabecera de tabla
                document.getElementById('tabla-cabecera').innerHTML = `<tr>${cabeceras.map(c => `<th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase bg-gray-50">\${c}</th>`).join('')}</tr>`;

                // Mostrar panel principal
                document.getElementById('total-registros').innerText = `Total filas cargadas: ${datosOriginales.length.toLocaleString()}`;
                document.getElementById('main-panel').classList.remove('hidden');

            } catch (err) {
                document.getElementById('config-section').classList.remove('hidden');
                alert("Error: " + err.message);
            }
        }

        function filtrarDatos() {
            const colIndex = parseInt(document.getElementById('buscar-columna').value);
            const query = document.getElementById('buscar-input').value.toLowerCase().trim();
            const cuerpo = document.getElementById('tabla-cuerpo');

            if(!query) {
                cuerpo.innerHTML = `<tr><td colspan="100" class="text-center py-8 text-gray-500">Escribe en el buscador para filtrar registros...</td></tr>`;
                return;
            }

            const filtrados = [];
            for(let i=0; i<datosOriginales.length; i++) {
                const fila = datosOriginales[i];
                if(fila[colIndex] && fila[colIndex].toLowerCase().includes(query)) {
                    filtrados.push(fila);
                }
                if(filtrados.length >= 30) break; // Límite para rendimiento en celulares de campo
            }

            if(filtrados.length === 0) {
                cuerpo.innerHTML = `<tr><td colspan="100" class="text-center py-8 text-gray-500">No hay coincidencias.</td></tr>`;
                return;
            }

            cuerpo.innerHTML = filtrados.map(fila => {
                return `<tr class="hover:bg-gray-50">${cabeceras.map((_, cIdx) => `<td class="px-4 py-3 text-gray-700 border-b">\${fila[cIdx] || ""}</td>`).join('')}</tr>`;
            }).join('');
        }
    </script>
</body>
</html>
